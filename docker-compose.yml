version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kognirecovery-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # SEC-009 FIX: Restringir a 127.0.0.1 para no exponer al exterior
      - '127.0.0.1:5437:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kognirecovery-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: kognirecovery-redis
    restart: unless-stopped
    ports:
      # SEC-009 FIX: Solo accesible desde localhost
      - '127.0.0.1:6380:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kognirecovery-network

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.16.0-community
    container_name: kognirecovery-neo4j
    hostname: kognirecovery-neo4j
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    ports:
      # SEC-009 FIX: Restringir a localhost
      - '127.0.0.1:7475:7474' # HTTP
      - '127.0.0.1:7688:7687' # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./docker/neo4j/import:/import
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - kognirecovery-network

  # Backend API
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kognirecovery-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '3003:3003'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3003/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - kognirecovery-network

  # Frontend (Expo Web)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kognirecovery-frontend
    restart: unless-stopped
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/server/node_modules
    ports:
      - '19006:19006'
      - '8084:8081'
    environment:
      - NODE_ENV=development
      - EXPO_PUBLIC_API_URL=http://192.168.1.84:3003
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    stdin_open: true
    tty: true
    depends_on:
      - api
    networks:
      - kognirecovery-network

  # pgAdmin (Opcional - Levantado con perfil 'tools')
  # SEC-023: pgAdmin con admin/admin solo accesible en localhost y solo con perfil 'tools'
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kognirecovery-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
    ports:
      # SEC-009 + SEC-023 FIX: Solo accesible desde localhost
      - '127.0.0.1:5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - kognirecovery-network
    profiles:
      - tools

  # TTS Service - Piper (rápido, calidad media)
  piper-tts:
    build:
      context: ./docker/piper
      dockerfile: Dockerfile
    container_name: kognirecovery-piper
    restart: unless-stopped
    ports:
      - '8008:8000'
    networks:
      - kognirecovery-network
    profiles:
      - tts

  # TTS Service - Kokoro (Recomendado: mejor calidad, español nativo, ligero)
  kokoro-tts:
    build:
      context: ./docker/kokoro
      dockerfile: Dockerfile
    container_name: kognirecovery-kokoro
    restart: unless-stopped
    ports:
      - '8009:8000'
    networks:
      - kognirecovery-network
    profiles:
      - tts

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

networks:
  kognirecovery-network:
    driver: bridge