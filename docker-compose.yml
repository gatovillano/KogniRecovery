services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kognirecovery-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # SEC-PHASE1: credenciales obligatorias (falla si faltan en .env)
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER no definido en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD no definido en .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB no definido en .env}
    ports:
      # SEC-009 FIX: Restringir a 127.0.0.1 para no exponer al exterior
      - '127.0.0.1:5437:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kognirecovery-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: kognirecovery-redis
    restart: unless-stopped
    ports:
      # SEC-009 FIX: Solo accesible desde localhost
      - '127.0.0.1:6380:6379'
    volumes:
      - redis_data:/data
    # SEC-PHASE1: Redis con contraseña obligatoria.
    command: >
      sh -c 'exec redis-server --appendonly yes
        --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD no definido en .env}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kognirecovery-network

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.16.0-community
    container_name: kognirecovery-neo4j
    hostname: kognirecovery-neo4j
    restart: unless-stopped
    # Sin env_file: el entrypoint de Neo4j interpreta cualquier NEO4J_*
    # como opción de configuración y falla con NEO4J_URI/NEO4J_PASSWORD.
    environment:
      NEO4J_AUTH: ${NEO4J_USER:?NEO4J_USER no definido en .env}/${NEO4J_PASSWORD:?NEO4J_PASSWORD no definido en .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      # SEC-PHASE2: apoc.* ya no está unrestricted; el código no lo usa.
      # Si en el futuro se necesita, habilitar SOLO los procedimientos puntuales.
    ports:
      # SEC-009 FIX: Restringir a localhost
      - '127.0.0.1:7475:7474' # HTTP
      - '127.0.0.1:7688:7687' # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./docker/neo4j/import:/import
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - kognirecovery-network

  # Backend API
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kognirecovery-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      kokoro-tts:
        condition: service_started
    env_file:
      - .env
    # Dentro de la red de Docker los servicios se resuelven por nombre,
    # no por localhost ni por los puertos publicados en el host.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NEO4J_URI: bolt://neo4j:7687
      # Express confía en los headers X-Forwarded-* (XFF) para que req.ip y
      # express-rate-limit identifiquen correctamente al cliente detrás de
      # Docker/reverse proxy. Sin esto, express-rate-limit lanza
      # ERR_ERL_UNEXPECTED_X_FORWARDED_FOR si llega un header XFF.
      TRUST_PROXY: "true"
      # TTS: dentro de la red Docker los servicios se resuelven por nombre.
      # Kokoro es el fallback local (gratis); ElevenLabs se configura desde el
      # panel de administración (IA / LLM → Voz) y se puede pasar la key por
      # entorno como valor por defecto.
      TTS_KOKORO_URL: ${TTS_KOKORO_URL:-http://kokoro-tts:8000}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    volumes:
      - ./server:/usr/src/app
      # Usamos el node_modules del host (bind mount) en lugar de un volumen
      # anónimo: un volumen anónimo se inicializa UNA vez desde la imagen y
      # persiste entre rebuilds, por lo que quedaba obsoleto (ej. faltaba
      # @huggingface/transformers). Con bind mount las dependencias siempre
      # quedan sincronizadas con `npm install` del host.
      - ./server/node_modules:/usr/src/app/node_modules
    ports:
      # SEC-PHASE1: no exponer la API a la red; solo localhost (detrás
      # de un reverse proxy con TLS en producción).
      - '127.0.0.1:3003:3003'
    healthcheck:
      # node:20-slim no trae wget/curl; usamos fetch nativo de Node
      test:
        ['CMD', 'node', '-e', "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - kognirecovery-network

  # Frontend (Expo Web)
  # Panel web de terapeutas (Next.js)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${WEB_PUBLIC_API_URL:-https://apirecovery.kognitoai.cloud}
    container_name: kognirecovery-web
    restart: unless-stopped
    environment:
      # SEC-PHASE1: el secreto de sesión del panel web es OBLIGATORIO;
      # no hay valor por defecto (antes era público).
      SESSION_SECRET: ${WEB_SESSION_SECRET:?WEB_SESSION_SECRET no definido en .env}
      COOKIE_SECURE: "true"
      NEXT_PUBLIC_API_URL: ${WEB_PUBLIC_API_URL:-https://apirecovery.kognitoai.cloud}
    ports:
      - '127.0.0.1:3004:3004'
    networks:
      - kognirecovery-network

  # Frontend (Expo Web)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kognirecovery-frontend
    restart: unless-stopped
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/server/node_modules
    ports:
      - '19006:19006'
      - '8084:8081'
    environment:
      - NODE_ENV=development
      - EXPO_PUBLIC_API_URL=http://192.168.1.84:3003
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    stdin_open: true
    tty: true
    depends_on:
      - api
    networks:
      - kognirecovery-network

  # pgAdmin (Opcional - Levantado con perfil 'tools')
  # SEC-023: pgAdmin con admin/admin solo accesible en localhost y solo con perfil 'tools'
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kognirecovery-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # SEC-PHASE1: credenciales de pgAdmin obligatorias (nunca vacías).
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL no definido en .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD no definido en .env}
      PGADMIN_LISTEN_PORT: 80
    ports:
      # SEC-009 + SEC-023 FIX: Solo accesible desde localhost
      - '127.0.0.1:5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - kognirecovery-network
    profiles:
      - tools

  # TTS Service - Piper (rápido, calidad media)
  piper-tts:
    build:
      context: ./docker/piper
      dockerfile: Dockerfile
    container_name: kognirecovery-piper
    restart: unless-stopped
    ports:
      - '8008:8000'
    networks:
      - kognirecovery-network
    profiles:
      - tts

  # TTS Service - Kokoro (Recomendado: mejor calidad, español nativo, ligero)
  # Se levanta por defecto (sin perfil): es el fallback de voz del asistente.
  kokoro-tts:
    build:
      context: ./docker/kokoro
      dockerfile: Dockerfile
    container_name: kognirecovery-kokoro
    restart: unless-stopped
    ports:
      - '8009:8000'
    networks:
      - kognirecovery-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

networks:
  kognirecovery-network:
    driver: bridge